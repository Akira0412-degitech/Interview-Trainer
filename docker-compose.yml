services:

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ── Frontend (Next.js) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ── MySQL Database ──────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=interview_trainer
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend (Express + WebSocket) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - SANDBOX_URL=http://sandbox:8888
      - DATABASE_URL=mysql://root:1234@mysql:3306/interview_trainer
      - DATABASE_HOST=mysql
      - DATABASE_USER=root
      - DATABASE_PASSWORD=1234
      - DATABASE_NAME=interview_trainer
      - DATABASE_PORT=3306
    env_file:
      - ./backend/.env
    depends_on:
      sandbox:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - app-network
      - sandbox-network
    restart: unless-stopped

  # ── Sandbox (isolated code execution) ───────────────────────────────────
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    # No ports exposed to the host — only reachable from backend via sandbox-network
    networks:
      - sandbox-network
    environment:
      - NODE_ENV=production
    # ── Security hardening ──────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Writable /tmp for temporary code files; size-limited
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m   # disable swap (swap == mem_limit)
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8888/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge

  # internal: true means containers on this network cannot reach the internet
  sandbox-network:
    driver: bridge
    internal: true

volumes:
  mysql-data:
